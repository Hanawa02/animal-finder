name: Create Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  get-tag:
    name: Get tag name
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.get-tag.name }}
    steps:
      - id: get-tag
        run: echo "NAME=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build-gradle-project:
    uses: ./.github/workflows/build-gradle-project.yml
    with:
      upload-artifacts: true
      checkout-ref: ${{ needs.get-tag.outputs.NAME }}

  create-release:
    needs:
      - build-gradle-project
      - get-tag
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Debug Info
        run: |
          echo "tag_name: .${{ needs.get-tag.outputs.NAME }}. ref_name: .${{ github.ref_name }}."
#      - name: Checkout code
#        uses: actions/checkout@v4
#        with:
#          ref: ${{needs.get-tag.outputs.NAME}}
      - name: Download Build Files
        uses: actions/download-artifact@v4
        with:
          name: Build Files
          path: build/libs
      - name: Create Release
        run: gh release create ${{ github.ref_name }} ./build/libs/* --generate-notes --verify-tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}