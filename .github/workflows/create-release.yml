name: Create Release

on:
  push:
    tags:
      - '**'

jobs:
  build-gradle-project:
    uses: ./.github/workflows/build-gradle-project.yml
    with:
      upload-artifacts: true

  create-release:
    needs:
      - build-gradle-project
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: extract-versions
        name: Extracting versions from properties
        shell: bash
        run: |
          echo "mod_version=$(cat gradle.properties | grep -w "\bmod_version" | cut -d= -f2)" >> $GITHUB_OUTPUT |
          echo "minecraft_version=$(cat gradle.properties | grep -w "\bminecraft_version" | cut -d= -f2)" >> $GITHUB_OUTPUT
      - name: Download Build Files
        uses: actions/download-artifact@v4
        with:
          name: Build Files
          path: build/libs
      - name: Create Release
        run: | 
          echo "${{ steps.extract-versions.outputs.mod_version }} for Minecraft ${{ steps .extract-versions.outputs.minecraft_version }}" |
          gh release create ${{ github.ref_name }} ./build/libs/* --generate-notes --verify-tag --target ${{ github.ref_name }} --title "${{ steps.extract-versions.outputs.mod_version }} for Minecraft ${{ steps 
          .extract-versions.outputs.minecraft_version }}"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}